project:
  type: website
  render:
    - "!code/*"
    - slides/
    - index.qmd
    - README.qmd
  output-dir: docs
  preview:
    port: 4200
    navigate: false


execute:
  freeze: auto  # re-render only when source changes
  error: true

website:
  title: "SISBID Data Visualization"

  repo-url: https://github.com/dicook/sisbid
  repo-actions: [issue]

  navbar:
    left:
      - href: index.html
        text: Home
        aria-label: Home
      - text: Day 1
        aria-label: Day 1 content
        menu:
          - href: slides/0-preamble.rjs.html
            text: Preamble
          - href: slides/1-1-ggplot.rjs.html
            text: 1.1 ggplot
          - href: slides/1-2-ggplot-adv.rjs.html
            text: 1.2 Advancing ggplot
          - href: slides/1-3-perception.rjs.html
            text: 1.3 Perception
      - text: Day 2
        aria-label: Day 2 content
        menu:
          - href: slides/2-1-tidyr.rjs.html
            text: 2.1 tidyr
          - href: slides/2-2-messy-it-up.rjs.html
            text: 2.2 Messy data
          - href: slides/2-3-wrangling.rjs.html
            text: 2.3 Wrangling
          - href: slides/2-4-mvplot.rjs.html
            text: 2.4 Multivariate Plots
          - href: slides/2-5-mvplot-tour.rjs.html
            text: 2.5 Tours
          - href: slides/2-6-adv-graphics.rjs.html
            text: 2.6 Advanced Graphics
      - text: Day 3
        aria-label: Day 3 content
        menu:
          - href: slides/3-1-interactive-plots.rjs.html
            text: 3.1 Interactive plots
          - href: slides/3-2-shiny-apps.rjs.html
            text: 3.2 Shiny apps
          - href: slides/3-3-shiny-reactivity.rjs.html
            text: 3.3 Shiny reactivity
          - href: slides/3-4-theme-shiny.rjs.html
            text: 3.4 Theming Shiny
          - href: slides/3-5-build-shiny-app.rjs.html
            text: 3.5 Build a Shiny App
          # - href: slides/3-6-interactive-document.rjs.html
          #   text: 3.6 Interactive Documents

format:
  html:
    theme:
      light: ['css/my-light.scss', 'css/custom.scss', flatly]
      dark: ['css/my-dark.scss', 'css/custom.scss', darkly]
    respect-user-color-scheme: true
    toc: true


